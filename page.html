
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #0057b8;
        }

        p {
            color: #333;
            font-size: 18px;
        }

        button {
            background-color: #0057b8;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #003d80;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website!</h1>

    <p>Hello! My name is Gaurav.</p>

    <p>This is my first simple HTML webpage.</p>

    <button onclick="alert('Hello! Welcome to my website!')">
        Click Me
    </button>

</body>
</html>
